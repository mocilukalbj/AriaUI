name: Windows native integration
on:
  push:
    branches: [windows]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        native_aot: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-aria2
      - name: Publish Windows package
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          NATIVE_AOT: ${{ matrix.native_aot }}
        run: ./packaging/build_release_windows.ps1 -MsysPrefix "$env:MSYS2_LOCATION/ucrt64" -NativeAot:($env:NATIVE_AOT -eq 'true')
      - name: Test native engine and actual host
        shell: pwsh
        run: |
          $env:ARIAUI_NATIVE_DIR = (Resolve-Path ./publish/win-x64/runtimes/win-x64/native).Path
          $env:ARIAUI_TEST_HOST = (Resolve-Path ./publish/win-x64/AriaUI.Host.exe).Path
          dotnet run --project tests/AriaUI.Tests -c Release -r win-x64 -- --https
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AriaUI-win-x64-aot-${{ matrix.native_aot }}
          path: publish/win-x64/
