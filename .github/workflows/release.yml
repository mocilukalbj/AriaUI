name: Release Native AOT

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            rid: win-x64
            archive_ext: zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libfontconfig1-dev libice-dev libsm-dev libx11-dev libxext-dev

      - name: Publish Native AOT
        if: runner.os == 'Linux'
        run: dotnet publish -r ${{ matrix.rid }} -c Release /p:PublishAot=true -o publish/${{ matrix.rid }}

      - name: Setup Windows native dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-aria2

      - name: Publish Windows Native AOT with download engine
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./packaging/build_release_windows.ps1 -MsysPrefix "$env:MSYS2_LOCATION/ucrt64" -NativeAot

      - name: Archive artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czvf ../../AriaUI-${{ matrix.rid }}-${{ github.ref_name }}.tar.gz *
          cd ../..

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath AriaUI-${{ matrix.rid }}-${{ github.ref_name }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AriaUI-${{ matrix.rid }}
          path: AriaUI-${{ matrix.rid }}-${{ github.ref_name }}.${{ matrix.archive_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
