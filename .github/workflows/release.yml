name: Release Native AOT

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libfontconfig1-dev libice-dev libsm-dev libx11-dev libxext-dev

      - name: Publish Native AOT (Linux x64)
        run: |
          dotnet publish -r linux-x64 -c Release /p:PublishAot=true -o publish/linux-x64
          cd publish/linux-x64
          tar -czvf ../../AriaUI-linux-x64-${{ github.ref_name }}.tar.gz AriaUI libHarfBuzzSharp.so libSkiaSharp.so
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            AriaUI-linux-x64-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
